name: Feature Request
description: Missing something? Describe what you'd like.
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-description
    attributes:
      label: What's the problem?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Want to work on it?
      options:
        - label: Yes, I'll open a PR
        - label: Maybe, but I'd like guidance
        - label: No, just sharing the idea
