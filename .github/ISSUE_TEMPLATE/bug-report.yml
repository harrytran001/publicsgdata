name: Bug Report
description: Something broken? Tell us what happened.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: client-config
    attributes:
      label: Code / setup
      description: The client code or config that triggers the bug
      placeholder: |
        ```python
        from publicsgdata import DataGovSGClient
        client = DataGovSGClient()
        ```
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python:
        - publicsgdata version:
        - Client: DataGovSG / LTA / OneMap
    validations:
      required: true
