name: PR Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  lint-pr:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        env:
          TITLE: "${{ github.event.pull_request.title }}"
        run: |
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          REGEX='^(\[(feat|fix|test|refactor|chore|style|revert|release|docs|examples)\][[:space:]]+.+|(feat|fix|test|refactor|chore|style|revert|release|docs|examples):[[:space:]]+.+|(feat|fix|test|refactor|chore|style|revert|release|docs|examples)-[a-z0-9-]+)$'

          if [[ "$TITLE_LOWER" =~ $REGEX ]]; then
            echo "PR title format is valid."
          else
            echo "PR title '$TITLE' does not match the required format."
            echo "Use one of: [feat] title, feat: title, or feat-some-title"
            exit 1
          fi
