name: Release packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: publicsgdata
        type: choice
        options:
          - publicsgdata
          - publicsgdata-mcp
          - both
      publish_target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build publicsgdata
        if: inputs.package == 'publicsgdata' || inputs.package == 'both'
        run: uv build --package publicsgdata

      - name: Build publicsgdata-mcp
        if: inputs.package == 'publicsgdata-mcp' || inputs.package == 'both'
        run: uv build --package publicsgdata-mcp

      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
