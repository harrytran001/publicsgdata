[project]
name = "publicsgdata"
version = "0.2.2"
description = "Python client for Singapore government open data (data.gov.sg, LTA, OneMap)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "publicsgdata contributors" }]
keywords = ["singapore", "open-data", "data.gov.sg", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0,<1",
    "pydantic>=2.0,<3",
    "typing-extensions>=4.8,<5",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/harrytran001/publicsgdata"
Repository = "https://github.com/harrytran001/publicsgdata"
Documentation = "https://github.com/harrytran001/publicsgdata/tree/main/packages/publicsgdata"
Issues = "https://github.com/harrytran001/publicsgdata/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publicsgdata"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/CHANGELOG.md",
    "/src/publicsgdata",
    "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: live data.gov.sg API tests (local only; use ./scripts/test_integration.sh)",
]
